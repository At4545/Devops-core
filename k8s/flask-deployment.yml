apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment

spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-container
          image: python:3.9-alpine
          ports:
            - containerPort: 5000
          command: ["/bin/sh", "-c"]
          args: ["while true; do echo 'Flask container keeping awake... ' $REDIS_HOST; sleep 3600; done"]
          env:
            - name: REDIS_HOST
              value: "redis-service"

