apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  labels:
    app: cache-redis
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: cache-redis
  template:
    metadata:
      labels:
        app: cache-redis


    spec:
      containers: 
      -  name: redis
         image: redis:alpine
         ports:
         -  containerPort: 80
